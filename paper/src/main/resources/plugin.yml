name: kokonut_nametag
version: ${version}
description: 플레이어 머리 위 닉네임과 칭호를 표시하는 이름표 플러그인
main: org.alexdev.unlimitednametags.UnlimitedNameTags
api-version: '26.3'
author: pingpong
folia-supported: true
libraries:
  - net.jodah:expiringmap:${expiringMapVersion}
  - org.apache.commons:commons-jexl3:${commonsJexl3Version}
  # SnakeYAML Engine — used by shaded ConfigLib + SettingsYamlMigrator (not in fat jar)
  - org.snakeyaml:snakeyaml-engine:${snakeyamlEngineVersion}

depend:
  - packetevents
softdepend:
  - PlaceholderAPI
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Nexo
  - HMCCosmetics
permissions:
  unt.shownametags:
    default: true
  unt.showownnametag:
    default: true
  unt.reload:
    default: op
  unt.debug:
    default: op
  unt.hide:
    default: op
  unt.show:
    default: op
  unt.refresh:
    default: op
  unt.billboard:
    default: op
  unt.formatter:
    default: op
  unt.hideOtherNametags:
    default: true
  unt.showOtherNametags:
    default: true
  unt.preferences:
    default: true
  unt.preferences.others:
    default: op
  unt.glow:
    default: op
  unt.glow.others:
    default: op
compiled: ${compiled}
